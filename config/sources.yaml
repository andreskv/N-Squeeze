# ─────────────────────────────────────────────────────────────────────────────
# Data-source registry.
#   verified: false  → endpoint/terms not yet checked by hand.
#   recoverable: false → history cannot be rebuilt later.
# ─────────────────────────────────────────────────────────────────────────────

agsi:
  name: GIE AGSI+ gas storage
  layer: gas_storage_model
  portal: https://agsi.gie.eu
  frequency: daily
  auth: { env: AGSI_API_KEY, header: x-key }
  recoverable: false   # vintages are revised
  verified: true   # fetched with key 2026-10-13
  phase: 0

alsi:
  name: GIE ALSI+ LNG terminals
  layer: gas_storage_model
  portal: https://alsi.gie.eu
  frequency: daily
  auth: { env: AGSI_API_KEY, header: x-key }
  fields: "inventory{lng,gwh}, sendOut, dtmi{lng,gwh}, dtrs (GIE API manual v013, March 2025)"
  rate_limit: 60 calls/min; data published once a day at 19:30
  recoverable: false
  verified: true   # fields confirmed live with key 2026-10-13
  phase: 0

entsog:
  name: ENTSOG Transparency Platform
  layer: gas_storage_model
  portal: https://transparency.entsog.eu
  frequency: daily
  auth: none
  scope: all points archived (≈1,000/day, kWh/d); supply buckets in gas_balance.classify_points
  metadata: config/entsog_interconnections.csv (API snapshot 2026-10-12)
  history: API serves a rolling ~5 years (from 2021-01-01 on 2026-10-12); older days only in TP Archives
  recoverable: partly   # via the API only while inside the rolling window
  verified: true   # /api/v1/operationaldatas parsed 2026-10-12
  phase: 0

entsoe:
  name: ENTSO-E generation by fuel
  layer: gas_storage_model
  portal: https://transparency.entsoe.eu
  frequency: hourly
  auth: { env: ENTSOE_TOKEN }
  areas: config/entsoe_areas.csv (EU-27 country EIC codes)
  recoverable: true
  verified: true   # parsed 2026-10-13; fossil gas (B04) only; MT returns no data
  phase: 2

weather:
  name: Open-Meteo historical API (ERA5), daily Tmax/Tmin at one point per EU-27 country
  layer: gas_storage_model
  portal: https://open-meteo.com
  frequency: daily
  auth: none
  points: config/weather_points.csv (capitals, grade C proxy; checked against eurostat_hdd)
  terms: free for non-commercial use; fair-use quota (HTTP 429 when exceeded)
  recoverable: true
  verified: true   # parsed 2026-10-12; history from 1940
  phase: 2

henry_hub:
  name: EIA Henry Hub daily spot (RNGWHHD)
  layer: nitrogen_cost_model
  portal: https://www.eia.gov/opendata/
  frequency: daily
  auth: { env: EIA_API_KEY }
  recoverable: true
  verified: true   # fetched with key 2026-10-13
  phase: 0

ecb_fx:
  name: ECB euro reference rate USD/EUR
  layer: nitrogen_cost_model
  portal: https://data.ecb.europa.eu
  frequency: daily
  auth: none
  recoverable: true
  verified: true   # fetched and parsed 2026-10-12
  phase: 0

ecb_fx_nok:
  name: ECB euro reference rate NOK/EUR
  layer: market_tests
  portal: https://data.ecb.europa.eu
  frequency: daily
  auth: none
  recoverable: true
  verified: true   # fetched and parsed 2026-10-19
  phase: 0

ecb_fx_pln:
  name: ECB euro reference rate PLN/EUR
  layer: market_tests
  portal: https://data.ecb.europa.eu
  frequency: daily
  auth: none
  recoverable: true
  verified: true   # fetched and parsed 2026-10-21
  phase: 0

firms_viirs:
  name: NASA FIRMS VIIRS 375 m active fire, S-NPP (standard, then near-real-time)
  layer: plant_activity
  portal: https://firms.modaps.eosdis.nasa.gov
  frequency: daily
  auth: { env: FIRMS_MAP_KEY }
  recoverable: true
  verified: true   # area API fetched and parsed 2026-10-23
  phase: 3

weather_plants:
  name: Open-Meteo historical API (ERA5), daily Tmax/Tmin at each plant in config/plants.csv
  layer: plant_activity
  portal: https://open-meteo.com
  frequency: daily
  auth: none
  recoverable: true
  verified: true   # parsed 2026-10-23
  phase: 3

s2_plume:
  name: Sentinel-2 L2A scene classes 8-9 near each plant (Google Earth Engine)
  layer: plant_activity
  portal: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_S2_SR_HARMONIZED
  frequency: per scene
  auth: { env: GEE_PROJECT }
  recoverable: true
  verified: true   # checked on a site outside the panel 2026-10-23
  phase: 3

eurostat_c2015:
  name: Eurostat monthly production index, NACE C20.15 fertilisers and nitrogen compounds (sts_inpr_m, calendar adjusted, 2021=100)
  layer: plant_activity
  portal: https://ec.europa.eu/eurostat/databrowser/view/sts_inpr_m/default/table
  frequency: monthly (revised; vintages kept)
  auth: none
  recoverable: false
  verified: true   # API call checked 2026-10-24: DE, EL, ES, FR, IT, NL from 2019-01 to 2026-08
  phase: 3

gfw_presence:
  name: Global Fishing Watch AIS presence by vessel and month in each coastal plant's berth zone (4Wings report, public-global-presence)
  layer: plant_activity
  portal: https://globalfishingwatch.org/our-apis/documentation/docs/v3/4wings/report
  frequency: monthly (revised; vintages kept)
  auth: { env: GFW_API_TOKEN }
  recoverable: true
  verified: true   # report checked 2026-10-25 at Sluiskil; non-commercial use only
  phase: 3

s5p_no2:
  name: Sentinel-5P TROPOMI tropospheric NO2, weekly, disc and ring around each plant (Google Earth Engine)
  layer: plant_activity
  portal: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_S5P_OFFL_L3_NO2
  frequency: weekly (ISO week)
  auth: { env: GEE_PROJECT }
  recoverable: true
  verified: false
  phase: 3

eua_auctions:
  name: EEX EUA primary-auction results (2012 → today)
  layer: nitrogen_cost_model
  portal: https://www.eex.com/en/market-data/market-data-hub/environmentals/eex-eua-primary-auction-spot-download
  frequency: daily (auction days)
  auth: none
  grade: A    # exchange-published clearing prices
  recoverable: true
  verified: true   # history zip + 2026 file
  phase: 0

pink_sheet_monthly:
  name: World Bank Pink Sheet, monthly (Henry Hub, Europe gas/TTF, Japan LNG, urea, DAP)
  layer: nitrogen_cost_model
  portal: https://www.worldbank.org/en/research/commodity-markets
  url: https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx
  frequency: monthly
  auth: none
  licence: CC BY 4.0
  grade: A    # official monthly anchor
  recoverable: true
  verified: true   # parsed 2026-10-12
  phase: 1
  breaks:
    - "Natural gas, Europe = TTF only from 2015-04 (earlier: import-border blend)"
    - "Urea = f.o.b. Black Sea until 2022-02, f.o.b. Middle East from 2022-03"
  note: The URL embeds a yearly document id; the old worldbank.org mirror serves a stale 2016 file.

ttf_daily_candidate:
  name: Candidate daily TTF, Yahoo Finance TTF=F front-month close (EUR/MWh), from 2017-10-23
  layer: nitrogen_cost_model
  frequency: daily
  auth: none
  grade: B    # passed the monthly reconciliation test on 2026-10-15 (98 of 98 months within 3 %)
  recoverable: false   # snapshot daily
  verified: true   # fetched and parsed 2026-10-15
  phase: 0

equities_daily:
  name: Daily adjusted close of nitrogen producers (local currency) and of the S&P 500 and MSCI country ETFs (USD), Yahoo Finance
  layer: market_tests
  frequency: daily
  auth: none
  grade: C
  recoverable: true   # Yahoo serves the full history; snapshots keep the vintage
  verified: true   # every ticker fetched and parsed 2026-10-19
  phase: 0

comext:
  name: Eurostat Comext imports by origin (CN 2814, 3102 10)
  layer: shipping_and_trade
  portal: https://ec.europa.eu/eurostat/comext/newxtweb/
  api: https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/DS-045409
  scope: reporter EU27_2020, all partners, products 2814 and 310210, imports, tonnes and euros
  frequency: monthly
  auth: none
  recoverable: true
  verified: true   # parsed 2026-10-12
  phase: 1

ets_registry:
  name: EU ETS verified emissions per stationary installation, 2008 onward (Commission Union Registry file verified_emissions_<year>_en.xlsx)
  layer: nitrogen_cost_model
  frequency: annual (published in April; the latest file holds all years)
  auth: none
  grade: A
  role: annual output test (ETS-implied output vs capacity); main activity 41 = ammonia, 38 = nitric acid
  recoverable: true
  verified: true   # 2025 file parsed 2026-10-14; 13,414 installations, tCO2e
  phase: 1

gem_plants:
  name: Global Energy Monitor — Global Chemicals Inventory (ammonia plants)
  layer: nitrogen_cost_model
  portal: https://www.gem.wiki
  frequency: static
  licence: check
  recoverable: true
  verified: false
  phase: 1

portwatch:
  name: IMF PortWatch chokepoint transits (Hormuz)
  layer: shipping_and_trade
  portal: https://portwatch.imf.org
  frequency: daily
  auth: none
  api: ArcGIS FeatureServer Daily_Chokepoints_Data (key-free)
  history: from 2019-01-01 only; vessel classes have no LNG split (LNG sits in n_tanker)
  role: primary source for the regime indicator R(t)
  recoverable: false   # snapshot weekly: definitions and filters change
  verified: true   # parsed 2026-10-12
  phase: 0

wto_hormuz:
  name: WTO Strait of Hormuz Trade Tracker
  layer: shipping_and_trade
  portal: https://datalab.wto.org/Strait-of-Hormuz-Trade-Tracker
  frequency: weekly
  auth: none
  recoverable: false
  verified: false
  phase: 0

aisstream:
  name: aisstream.io live terrestrial AIS
  layer: shipping_and_trade
  portal: https://aisstream.io
  frequency: streaming
  auth: { env: AISSTREAM_API_KEY }
  recoverable: false   # ETAs/destinations are lost forever if not archived live
  verified: true   # subscription accepted 2026-10-13
  phase: 0

eurostat_population:
  name: Eurostat population on 1 January (demo_pjan), EU-27 countries
  layer: gas_storage_model
  frequency: annual
  auth: none
  grade: A
  role: population weights for the EU-27 HDD
  recoverable: true
  verified: true   # parsed 2026-10-12
  phase: 2

eurostat_hdd:
  name: Eurostat heating degree days by country, monthly (nrg_chdd_m; JRC data)
  layer: gas_storage_model
  frequency: monthly
  auth: none
  grade: A
  role: reference for the daily HDD built from weather points (gas_balance.hdd_check)
  recoverable: true
  verified: true   # parsed 2026-10-12
  phase: 2

eurostat_hdd_nuts2:
  name: Eurostat heating degree days by NUTS-2 region, monthly (nrg_chddr2_m; JRC data)
  layer: gas_storage_model
  frequency: monthly
  auth: none
  grade: A
  role: population-weighted reference for the daily HDD (Eurostat's country HDD is area-weighted)
  recoverable: true
  verified: true   # parsed 2026-10-14
  phase: 2

eurostat_population_nuts2:
  name: Eurostat population on 1 January by NUTS-2 region (demo_r_d2jan)
  layer: gas_storage_model
  frequency: annual
  auth: none
  grade: A
  role: weights for the NUTS-2 HDD reference
  recoverable: true
  verified: true   # parsed 2026-10-14
  phase: 2

s2_swir:
  name: Sentinel-2 L1C SWIR statistics in a box around each ammonia plant, per scene (Google Earth Engine)
  layer: plant_activity_index
  frequency: per scene (about 5 days)
  auth: GEE_PROJECT + earthengine authenticate
  grade: B
  role: raw input for the satellite utilisation index; no hot-spot threshold applied in the archive
  recoverable: true
  verified: true   # prototype 2026-10-16
  phase: 3

eurostat_gas_trade:
  name: Eurostat EU-27 gas imports and exports by partner, monthly (nrg_ti_gasm, nrg_te_gasm)
  layer: gas_storage_model
  frequency: monthly
  auth: none
  grade: A
  role: reference for the ENTSOG supply buckets (tolerance in OI-26)
  recoverable: true
  verified: true   # parsed 2026-10-13; TJ (GCV), natural gas G3000 and LNG G3200
  phase: 2
