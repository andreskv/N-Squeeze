  benchmark_ammonia:
    value: 1.522
    unit: tCO2e/t_NH3
    grade: A
    source: IR (EU) 2025/2620 Annex point 5, Column B (default CBAM benchmark BMg), CN 2814 10 00
    url: https://eur-lex.europa.eu/eli/reg_impl/2025/2620/oj/eng
  default_embedded_emissions:   # tCO2e/t NH3, CN 2814 10 00, total emissions before mark-up
    DZ: { value: 2.080, grade: A, name: Algeria }
    EG: { value: 2.050, grade: A, name: Egypt }
    RU: { value: 2.260, grade: A, name: Russian Federation }
    SA: { value: 2.100, grade: A, name: Saudi Arabia }
    TT: { value: 2.420, grade: A, name: Trinidad and Tobago }
    US: { value: 3.410, grade: A, name: United States }
    generic: { value: 3.130, grade: A, name: Other countries and territories }
    _source: IR (EU) 2025/2621 Annex I as corrected by IR (EU) 2026/1740, column 'total emissions'
    _url: https://eur-lex.europa.eu/eli/reg_impl/2026/1740/oj/eng
  benchmark_urea:
    value: 0.902
    unit: tCO2e/t_urea
    grade: A
    source: IR (EU) 2025/2620 Annex point 5, Column B (default CBAM benchmark BMg), CN 3102 10 19
    url: https://eur-lex.europa.eu/eli/reg_impl/2025/2620/oj/eng
  default_embedded_emissions_urea:   # tCO2e/t urea, CN 3102 10 19, total emissions before mark-up
    DZ: { value: 1.410, grade: A, name: Algeria }
    EG: { value: 1.390, grade: A, name: Egypt }
    RU: { value: 1.470, grade: A, name: Russian Federation }
    SA: { value: 1.470, grade: A, name: Saudi Arabia }
    TT: { value: 1.610, grade: A, name: Trinidad and Tobago }
    US: { value: 2.290, grade: A, name: United States }
    generic: { value: 2.720, grade: A, name: Other countries and territories }
    _source: IR (EU) 2025/2621 Annex I as corrected by IR (EU) 2026/1740, column 'total emissions'
    _url: https://eur-lex.europa.eu/eli/reg_impl/2026/1740/oj/eng

fitted:
  # Calibrated jointly on pre-2026 curtailment episodes (config/episodes.csv), then FROZEN.
  # Code refuse to compute U_pred while these are null.
  other_cash_cost_eu:  { value: null, unit: EUR/t_NH3, grade: C, status: fitted }
  other_cash_cost_us:  { value: null, unit: USD/t_NH3, grade: C, status: fitted }
  run_threshold_theta: { value: null, unit: EUR/t_NH3, grade: C, status: fitted }
  run_softness_s:      { value: null, unit: EUR/t_NH3, grade: C, status: fitted }
  margin_lookback_days: { value: 30, unit: days, grade: C, status: starting_value }
  freight:             { value: null, unit: EUR/t, grade: C, status: fitted_per_route, note: No free source; report wedge separately }

assumptions:
  # Explicit sensitivity bands, used where no free series exists. Results are always reported at both ends of the band
  urea_freight_usd_t:
    range: [15.0, 80.0]
    unit: USD/t_urea
    grade: C
    basis: Bulk urea freight to NW Europe; no free series. Wide band spanning calm and 2021–22 freight markets
    open_item: OI-16
  urea_duty_band:
    range: [0.0, 0.065]
    unit: share
    grade: B
    basis: Preferential origins 0 % to MFN 6.5 % (policy_schedule.csv); the FOB quote's origin mix is unknown

validation:
  reconciliation_tolerance:
    value: 0.03
    unit: share
    grade: C
    basis: Pre-set tolerance — daily series monthly mean vs World Bank/IMF monthly
  supply_bucket_tolerance:
    value: 0.10
    unit: share
    grade: C
    basis: Pre-set 13 Oct 2026, before the comparison - monthly ENTSOG net supply per bucket vs Eurostat net imports (nrg_ti_gasm, nrg_te_gasm)
  supply_bucket_pass_share:
    value: 0.90
    unit: share of months
    grade: C
    basis: Pre-set 13 Oct 2026 - a bucket passes if at least this share of months 2016-2025 is within supply_bucket_tolerance
  storage_backtest_mae_limit_pp:
    value: 5
    unit: percentage points of working-gas volume
    grade: C
    basis: Pre-set 14 Oct 2026, before any fit on AGSI+ data - storage back-test of EU storage on 1 April, winters ending 2016-2025, mean absolute error limit
  storage_backtest_max_limit_pp:
    value: 10
    unit: percentage points of working-gas volume
    grade: C
    basis: Pre-set 14 Oct 2026, before any fit on AGSI+ data - storage back-test, no single winter may miss by more than this
  onset_window_weeks:
    value: 4
    unit: weeks
    grade: C
    basis: Pre-set ± window for curtailment onset timing
  satellite_detection_auc_threshold:
    value: 0.75
    unit: AUC
    grade: C
    basis: Pre-set kill criterion for Layer 3

plant_activity:
  s2_box_radius_m:
    value: 1000
    unit: m
    grade: C
    basis: Judgement - a circle of this radius around the GEM coordinate covers a typical ammonia plant (reformer, stacks, flare); checked on Sluiskil only
  s2_clear_cs_cdf:
    value: 0.6
    unit: score
    grade: B
    source: Earth Engine catalog, Cloud Score+ S2_HARMONIZED - example threshold 0.60; values between 0.50 and 0.65 generally work well
    url: https://developers.google.com/earth-engine/datasets/catalog/GOOGLE_CLOUD_SCORE_PLUS_V1_S2_HARMONIZED

regime:
  # Chokepoint regime R(t) thresholds. Rules fixed 16 Oct 2026, before the values were computed; data 2019-2025 only
  transit_ratio_shock:
    value: 0.5561
    unit: ratio to the 2019-2025 median of daily Hormuz transits (84 per day)
    grade: C
    basis: Rule - below the lowest 7-day mean ratio in 2019-2025 (reached 11 Dec 2019). IMF PortWatch chokepoint6 n_total, 2557 of 2557 days
  gas_spread_stress:
    value: 85.29
    unit: EUR/MWh
    grade: C
    basis: Rule - 90th percentile of the 7-observation mean of daily TTF (Yahoo TTF=F) minus Henry Hub (EIA RNGWHHD, converted with same-day ECB USD/EUR), 2019-2025, on the 1735 days with all three. Days above it fall in 2021 (15) and 2022 (159)

fan_chart:
  # Weekly end-of-winter storage forecast, winter 2026/27. Rules fixed 16 Oct 2026, before the values were computed
  storage_thresholds_pct:
    value: [30.55, 44.0]
    unit: percent of working-gas volume on 1 April
    grade: C
    basis: Rule - lower and upper thirds (numpy linear quantiles) of EU storage on 1 April, winters ending 2016-2025, from AGSI+
  supply_scenarios_twh_d:
    value: { low: 9.1128, mid: 9.3122, high: 9.4801 }
    unit: TWh/d
    grade: C
    basis: Rule - mean daily net supply into the EU, 1 Jan to 31 Mar, in 2023, 2024 and 2025 (after the March 2022 break, before 2026); low, mid and high are the minimum, mean and maximum of the three
  log_window:
    value: ["2027-01-04", "2027-04-01"]
    grade: C
    basis: Pre-registered 16 Oct 2026 - one entry a week from the first date; the forecast is for EU storage on the second date
  draws_per_weather_year:
    value: 97
    unit: draws
    grade: C
    basis: Rule - at least 2500 draws in total over the 26 weather years 2000-2025, so the Monte Carlo standard error of a probability is at most 0.01. Seed 0
  residual_block:
    value: whole_window
    grade: C
    basis: Model error is one contiguous block of fitted daily residuals as long as the forecast window. Chosen 16 Oct 2026 after a first rule (block = lag where the residual autocorrelation falls below 1/e) gave 1 day and an error SD of 5.3 pp against 7.6 pp for whole-window blocks

reference_volumes_2024:
  # EU imports, for CBAM sanity check (validation test 6)
  ammonia_mt:        { value: 2.0, grade: B, source: Just Food }
  urea_mt:           { value: 5.9, grade: B, source: Just Food }
  n_mixtures_mt:     { value: 6.7, grade: B, source: Just Food }
  copa_cogeca_cbam_2026_eur_m: { value: 820, grade: B, source: Argus }
