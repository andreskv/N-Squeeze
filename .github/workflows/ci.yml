name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check nsqueeze tests
          ruff format --check nsqueeze tests
      - name: Tests (no network)
        run: pytest -m "not network" --cov=nsqueeze --cov-report=term-missing
      - name: Evidence summary
        run: nsq params
